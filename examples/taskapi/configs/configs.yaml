infra:
  logs:
    level: info
    format: json

services:
  repository:
    postgres:
      host: ${DB_HOST:-localhost}
      user: ${DB_USER:-postgres}
      password: ${DB_PASSWORD}
      database: ${DB_NAME:-tasks}

apps:
  http:
    port: ${PORT:-8080}
    endpoints_path_prefix: /api/v1
    use_trace_id: true
    request_timeout: 5s
    mask_internal_server_error_message: internal server error
