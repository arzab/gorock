services:
  logger:
    level: info
    format: json
  repository:
    postgres:
      host: ${DB_HOST:-localhost}
      port: ${DB_PORT:-5432}
      user: ${DB_USER:-postgres}
      password: ${DB_PASSWORD}
      database: ${DB_NAME:-tasks}

apps:
  http:
    port: ${PORT:-8080}
    prefix: /api/v1
